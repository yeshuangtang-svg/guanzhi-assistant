plugins { id 'com.android.application' }
android {
    namespace 'cn.shiguang.qwenpocket'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.shiguang.qwenpocket'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '1.5.2'
        ndk { abiFilters 'arm64-v8a' }
        multiDexEnabled true
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile '../build/gradle-input/AndroidManifest.xml'
        java.srcDirs += ['../build/gradle-input/java']
        java.exclude '**/OcrTool.java', '**/ExactMath.java', '**/CubeNet.java', '**/CubePreview.java', '**/SearchSettings.java'
        assets.srcDirs = ['../build/gradle-input/assets']
        jniLibs.srcDirs = ['../build/gradle-input/jniLibs']
    } }
    androidResources { noCompress += ['gguf'] }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST'] }
    }
}
dependencies {
    implementation 'org.jsoup:jsoup:1.21.2'
}
